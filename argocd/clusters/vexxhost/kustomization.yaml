#
# Future Vexxhost cluster (does not exist yet). Bootstrapped once with
# argocd/bootstrap/root-app.yaml; from then on ArgoCD manages itself
# from this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: ApplicationSet
      name: jenkins
    patch: |-
      - op: replace
        path: /spec/generators/0/selector/matchLabels/cluster
        value: vexxhost
