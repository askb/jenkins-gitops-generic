# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation
# One AppProject per LF project: it may only deploy into its own
# <project>-jenkins-* namespaces.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: odl
  namespace: argocd
spec:
  description: odl Jenkins
  sourceRepos:
    - https://github.com/askb/jenkins-gitops-generic.git
    - https://charts.jenkins.io
  destinations:
    - server: https://kubernetes.default.svc
      namespace: odl-jenkins-*
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
