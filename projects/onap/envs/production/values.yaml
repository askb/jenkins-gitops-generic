# Not deployed anywhere yet (prototype).
controller:
  image:
    # Set by the release workflow to <jenkinsVersion>-<git sha>.
    tag: "2.580.2"
  jenkinsUriPrefix: ""
  ingress:
    enabled: true
    ingressClassName: nginx
    hostName: jenkins.onap.org
    path: /
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
    tls:
      - secretName: jenkins-onap-org-tls
        hosts:
          - jenkins.onap.org
