apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Order matters: later components merge into earlier generators.
components:
  - ../../../../common
  - ../../base
  - ../../../../common/features/gerrit-trigger
  - ../../../../common/features/ci-local

configMapGenerator:
  - name: jenkins-env
    options:
      disableNameSuffixHash: true
    literals:
      - JENKINS_URL=http://localhost:8080/
      - SILO=ci
      - JENKINS_HOSTNAME=ci-onap-jenkins
      - SIGUL_KEY=none
      - MASTER_RTD_PROJECT=doc-test
      - OPENSTACK_INSTANCE_CAP=0
      - GERRIT_NO_CONNECTION_ON_STARTUP=true
