credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              id: jenkins
              description: Release Engineering JJB Key
              scope: GLOBAL
              username: jenkins
              privateKeySource:
                directEntry:
                  privateKey: ${jenkins-private-key}
          - openstackV3:
              id: vexx-ecompci
              description: vexx-ecompci
              userName: ${vexx-ecompci-username}
              password: ${vexx-ecompci-password}
              projectName: ef6e8825-fc3a-4ebf-886a-ba51ada06a9c
              projectDomain: Default
              userDomain: Default
          - usernamePassword:
              id: buildlogs
              description: buildlogs Nexus deployment
              scope: GLOBAL
              username: ${buildlogs-username}
              password: ${buildlogs-password}
