#
# 1Password vault "odl-jenkins-sandbox" holds one item "jenkins-jcasc".
# The service-account token secret "onepassword-token" is created once,
# out of band, when the namespace is bootstrapped (never in git).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: jcasc-store
spec:
  provider:
    onepasswordSDK:
      vault: odl-jenkins-sandbox
      auth:
        serviceAccountSecretRef:
          name: onepassword-token
          key: token
