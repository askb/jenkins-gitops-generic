apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secret-store.yaml

# Order matters: later components merge into earlier generators.
components:
  - ../../../../common
  - ../../base
  - ../../../../common/features/gerrit-trigger
  - ../../../../common/features/lf-sso

configMapGenerator:
  - name: jenkins-env
    options:
      disableNameSuffixHash: true
    literals:
      - JENKINS_URL=https://jenkins.opendaylight.org/releng/
      - SILO=releng
      - JENKINS_HOSTNAME=vex-yul-odl-jenkins-1
      - SIGUL_KEY=odl-release-2020
      - OPENSTACK_INSTANCE_CAP=75
      - GERRIT_USER=jenkins-releng
