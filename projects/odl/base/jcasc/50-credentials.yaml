# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation
#
# Credential shells only: every value is a ${key} read from
# /run/secrets/jcasc (projects/odl/secret-keys.txt lists them).
credentials:
  system:
    domainCredentials:
      - credentials:
          - basicSSHUserPrivateKey:
              id: jenkins-ssh
              description: SSH key for OpenStack build agents
              scope: GLOBAL
              username: jenkins
              privateKeySource:
                directEntry:
                  privateKey: ${jenkins-ssh-private-key}
          - openstackV3:
              id: os-cloud
              description: Vexxhost odlci project
              scope: GLOBAL
              userName: ${os-cloud-username}
              password: ${os-cloud-password}
              projectName: ${os-cloud-project}
              projectDomain: Default
              userDomain: Default
          - usernamePassword:
              id: cloud-username-pass
              description: clouds.yaml credentials for jobs
              scope: GLOBAL
              username: ${os-cloud-username}
              password: ${os-cloud-password}
          - usernamePassword:
              id: deployment-odlparent
              description: Nexus deployment (odlparent)
              scope: GLOBAL
              username: ${deployment-odlparent-username}
              password: ${deployment-odlparent-password}
          - usernamePassword:
              id: ossrh
              description: Sonatype OSSRH
              scope: GLOBAL
              username: ${ossrh-username}
              password: ${ossrh-password}
          - usernamePassword:
              id: dummy
              description: Placeholder for sandbox Maven deploys
              scope: GLOBAL
              username: dummy
              password: dummy
