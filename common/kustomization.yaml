# SPDX-FileCopyrightText: 2026 The Linux Foundation
#
# Shared layer. Generators use stable names (no hash suffix) so the
# config-reload sidecar sees in-place updates, not delete/create races.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - external-secret.yaml

configMapGenerator:
  - name: jenkins-jcasc-common
    files:
      - jcasc/00-jenkins.yaml
      - jcasc/10-security.yaml
      - jcasc/20-unclassified.yaml
      - jcasc/30-tool.yaml
    options:
      disableNameSuffixHash: true
      labels:
        jenkins-jenkins-config: "true"
