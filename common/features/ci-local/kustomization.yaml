#
# CI-only overrides, used instead of lf-sso. List this component AFTER the
# project component: it merges into the project's ConfigMap to swap
# 15-authz.yaml.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - no-internet-egress.yaml

configMapGenerator:
  - name: jenkins-jcasc-project
    behavior: merge
    files:
      - 15-authz.yaml
  - name: jenkins-jcasc-ci
    files:
      - 14-realm.yaml
      - 45-ci-pods.yaml
    options:
      disableNameSuffixHash: true
      labels:
        jenkins-jenkins-config: "true"
