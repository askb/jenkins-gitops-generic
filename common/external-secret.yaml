# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation
#
# Every JCasC ${key} secret comes from one item ("jenkins-jcasc") in the
# env's SecretStore "jcasc-store". Each field of the item becomes a file in
# /run/secrets/jcasc. The store is env-specific: 1Password in real envs, the
# ESO fake provider in CI (scripts/e2e.sh creates it).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-jcasc-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: jcasc-store
  target:
    name: jenkins-jcasc-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: jenkins-jcasc
